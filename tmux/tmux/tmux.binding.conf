bind r command-prompt "rename-window %%"
bind R source-file ~/.config/tmux/tmux.conf

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
# Pane navigation, hjkl exactly like vim. Seamless prefix-less <C-hjkl> across
# nvim splits and tmux panes is handled by vim-tmux-navigator (see tmux.conf).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator steals root <C-l>, so restore "clear screen" under the prefix.
bind C-l send-keys 'C-l'

