source-file ~/.config/tmux/tmux.binding.conf
set-option -g default-terminal 'xterm-256color'
set-option -ga terminal-overrides ',xterm-256color:RGB'   # truecolor, so rose-pine renders correctly

set -g base-index 1             # start indexing windows at 1 instead of 0
set -g detach-on-destroy off    # don't exit from tmux when closing a session
set -g escape-time 0             # zero-out escape time delay
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position top
#set -g default-terminal "${TERM}"
setw -g mode-keys vi
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'
set-window-option -g xterm-keys on
# set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

# set -Fg 'status-format[1]' '#{status-format[0]}'
# set -g 'status-format[0]' ''
# set -g status 2

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Save/Restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'   # Auto Save/Restore
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-open'

set -g @continuum-restore 'on'
set -g @resurrect-dir '~/.config/tmux/.tmux_resurrect'

set -g @sessionx-bind 'o'

# Full option list: https://github.com/rose-pine/tmux
set -g @rose_pine_variant 'main'             # 'main' | 'moon' | 'dawn'
set -g @rose_pine_date_time '%H:%M'          # right-side clock (was @catppuccin_date_time_text)
set -g @rose_pine_directory 'on'             # show current path (was @catppuccin_directory_text)
set -g @rose_pine_show_current_program 'on'  # window name = running program (was the "application" module)
# set -g @rose_pine_bar_bg_disable 'on'      # uncomment for a transparent status bar

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# set -Fg 'status-format[1]' '#{status-format[0]}'
set -g status 2
set -g 'status-format[1]' ''

